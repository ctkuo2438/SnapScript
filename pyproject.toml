[project]
name = "snapscript"
version = "0.1.0"
description = "Local AI-assisted CSV/Excel transformations with sandboxed pandas execution"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.86.0",
    "chardet>=7.4.0.post1",
    "mcp>=2.3,<3",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "rich>=14.3.3",
    "streamlit>=1.40.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
snapscript = ["prompts/*.txt"]

[dependency-groups]
dev = [
    "python-dotenv>=1.2.2",
    "pytest>=9.0.3",
]
